name: Node CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 20.x and lower are end-of-life and not supported by cookie, content-type or vitest
        # 22.13.0 is the oldest 22 release supported by all of our dev tools (eslint and jsdom)
        node-version: [22.13.0, 22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm ci, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm test
        env:
          CI: true
